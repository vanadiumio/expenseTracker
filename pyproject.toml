[project]
name = "expensetracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siddharth Mishra", email = "vanadium.io.509@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "fastapi[standard]>=0.128.8",
    "psycopg[binary,pool]>=3.2.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.39.0",
]

[project.scripts]
expensetracker = "expensetracker:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
